[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-quality-monitor"
version = "0.1.0"
description = "RAG evaluation across four dimensions with the Three-Hook Model (reference implementation)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["pydantic>=2"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "httpx>=0.27"]
anthropic = ["anthropic>=1.11"]
openai = ["openai>=1.40"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/rag_quality_monitor"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # long lines are fine for data tables and test fixtures
